<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDD Studio Professional - Gestor y Cuestionario de GDDs</title>

    <!-- FontAwesome 6 CDN (Iconos Grises Profesionales) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- html2pdf CDN para descargas directas de PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Hojas de Estilo Separadas -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/questionnaire.css">
    <link rel="stylesheet" href="css/preview.css">
    <link rel="stylesheet" href="css/print.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- CABECERA PRINCIPAL (TOPBAR) -->
    <header class="app-header">
        <div class="header-brand">
            <i class="fa-solid fa-gamepad icon-brand"></i>
            <div class="brand-text">
                <h1>GDD Studio Professional</h1>
                <span class="brand-subtitle">Gestión y Redacción de Game Design Documents</span>
            </div>
        </div>

        <!-- Indicador de Estado del GDD Activo -->
        <div class="header-active-info">
            <span class="active-gdd-title" id="header-active-title">Sin GDD Seleccionado</span>
            <div class="header-progress-container" title="Porcentaje de completitud del GDD">
                <div class="header-progress-fill" id="header-progress-bar"></div>
            </div>
            <span class="status-badge status-draft" id="header-completion-badge">Sin documento</span>
        </div>

        <!-- Navegación de Vistas y Acciones -->
        <nav class="header-nav">
            <button class="app-nav-btn active" id="nav-dashboard" onclick="AppModule.switchView('dashboard')">
                <i class="fa-solid fa-folder icon-gray"></i> Mis GDDs
            </button>

            <!-- Este grupo sólo se muestra cuando hay un GDD activo -->
            <div id="gdd-nav-actions" class="header-gdd-actions" style="display: none;">
                <button class="app-nav-btn" id="nav-questionnaire" onclick="AppModule.switchView('questionnaire')">
                    <i class="fa-solid fa-pen-to-square icon-gray"></i> Cuestionario
                </button>
                <button class="app-nav-btn" id="nav-preview" onclick="AppModule.switchView('preview')">
                    <i class="fa-solid fa-file-lines icon-gray"></i> Documento Vivo
                </button>
                <div class="header-sep"></div>
                <button class="btn btn-sm header-btn-ghost" onclick="AppModule.exportActiveGddJson()" title="Descargar copia de seguridad en JSON">
                    <i class="fa-solid fa-floppy-disk icon-gray"></i> Guardar JSON
                </button>
                <button class="btn btn-sm header-btn-success" onclick="AppModule.exportActivePdf()" title="Descargar directamente el PDF">
                    <i class="fa-solid fa-file-pdf"></i> Exportar PDF
                </button>
            </div>
        </nav>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="app-container">

        <!-- VISTA 1: DASHBOARD / MIS GDDS -->
        <section id="view-dashboard" class="view-section" style="display: block;">
            <div class="dashboard-header">
                <div class="dashboard-title">
                    <h2>Panel de Control de GDDs</h2>
                    <p>Crea, gestiona o exporta tus documentos de diseño de videojuegos.</p>
                </div>
                <div class="dashboard-actions">
                    <input type="file" id="import-json-input" accept=".json" style="display: none;">
                    <button class="btn btn-ghost" onclick="AppModule.triggerImportJson()">
                        <i class="fa-solid fa-file-import icon-gray"></i> Importar GDD (JSON)
                    </button>
                    <button class="btn btn-primary" onclick="AppModule.createNewGdd()">
                        <i class="fa-solid fa-plus"></i> Nuevo GDD
                    </button>
                </div>
            </div>

            <!-- Grilla de Tarjetas de GDDs -->
            <div class="gdd-cards-grid" id="gdd-cards-grid">
                <!-- Se renderiza dinámicamente con JavaScript -->
            </div>
        </section>

        <!-- VISTA 2: CUESTIONARIO / WIZARD -->
        <section id="view-questionnaire" class="view-section wizard-layout" style="display: none;">
            <!-- Navegación lateral de pasos -->
            <aside class="wizard-sidebar">
                <h3>Pasos del GDD</h3>
                <div class="step-nav-list" id="wizard-step-nav">
                    <!-- Se renderiza dinámicamente -->
                </div>
            </aside>

            <!-- Área de formulario del paso actual -->
            <article class="wizard-content" id="wizard-step-content">
                <!-- Se renderiza dinámicamente -->
            </article>
        </section>

        <!-- VISTA 3: VISTA PREVIA DEL DOCUMENTO Y EXPORTACIÓN PDF -->
        <section id="view-preview" class="view-section" style="display: none;">
            <div class="preview-toolbar">
                <div>
                    <h2><i class="fa-solid fa-file-lines icon-gray"></i> Documento Vivo de Diseño</h2>
                    <p class="text-muted">Vista preliminar tal como se generará la versión en PDF.</p>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-secondary" onclick="AppModule.switchView('questionnaire')">
                        <i class="fa-solid fa-pen icon-gray"></i> Editar GDD
                    </button>
                    <button class="btn btn-ghost" onclick="window.print()" title="Imprimir usando el diálogo del sistema">
                        <i class="fa-solid fa-print icon-gray"></i> Imprimir
                    </button>
                    <button class="btn btn-success" onclick="AppModule.exportActivePdf()">
                        <i class="fa-solid fa-file-pdf"></i> Descargar PDF Directo
                    </button>
                </div>
            </div>

            <!-- RENDERIZADO DEL DOCUMENTO A4 -->
            <div class="gdd-document-render" id="gdd-document-render">
                <!-- Se genera dinámicamente en preview.js -->
            </div>
        </section>

    </main>

    <!-- SCRIPTS EN ORDEN CORRECTO DE DEPENDENCIA -->
    <script src="js/template-data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/questionnaire.js"></script>
    <script src="js/preview.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
